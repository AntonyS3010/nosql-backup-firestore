name: Respaldo cifrado de tareas
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: backups
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIRESTORE_BACKUP_SERVICE_ACCOUNT }}
      - name: Obtener token temporal de lectura
        run: node scripts/access-token.mjs
      - name: Exportar únicamente tareas y cifrar
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node scripts/backup.mjs backup "$FIREBASE_PROJECT_ID" backups/tasks.enc.json
      - uses: actions/upload-artifact@v4
        with:
          name: tasks-encrypted-${{ github.run_id }}
          path: backups/tasks.enc.json
          retention-days: 7
          if-no-files-found: error
