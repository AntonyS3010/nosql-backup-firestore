name: Ensayar recuperación NoSQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global firebase-tools@15.36.0
      - run: node --check scripts/backup.mjs
      - name: Probar cifrado, recuperación exacta y rechazo de corrupción
        run: firebase emulators:exec --only firestore --project demo-backup-ci 'node --test tests/backup.test.mjs'
