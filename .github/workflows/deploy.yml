name: Probar y desplegar Bitácora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitacora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Probar reglas contra Firestore Emulator
        run: pnpm test
      - name: Ensayar respaldo y recuperación contra el emulador
        run: pnpm exec firebase emulators:exec --only firestore --project demo-bitacora-nosql 'node --test tests/backup.test.mjs'
      - name: Instalar Chromium para las pruebas UI
        run: pnpm exec playwright install --with-deps chromium
      - name: Comprobar CRUD y aislamiento desde el navegador
        run: pnpm test:ui
      - name: Conservar capturas, video y traza
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-ui
          path: |
            test-results
            playwright-report
      - name: Compilar aplicación
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: sitio-compilado
          path: dist
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FIREBASE_PROJECT_ID != ''
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: sitio-compilado
          path: dist
      - name: Publicar en Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
